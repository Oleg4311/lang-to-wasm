version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # типы Node должны соответствовать версии Node в CI и в engines (24)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
